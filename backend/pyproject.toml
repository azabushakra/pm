[project]
name = "pm-backend"
version = "0.1.0"
description = "Backend for project management MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118.0",
  "uvicorn[standard]>=0.37.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
